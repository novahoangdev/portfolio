<div class="outer" #outer>
  <div class="pin">
    <div class="track" #track>
      <div class="lead" aria-hidden="true">
        <span class="lead-count">{{ pad(projects().length) }}</span>
        <span class="lead-copy">projects<br />keep scrolling <span class="lead-arrow">→</span></span>
      </div>

      @for (project of projects(); track project.name; let i = $index) {
        <button
          #panel
          type="button"
          class="panel"
          [attr.data-project]="i"
          [style.--panel-accent]="project.accent"
          [attr.aria-label]="'Open ' + project.name + ' — ' + project.tagline"
          (click)="open(i, panel)"
        >
          <span class="panel-number" aria-hidden="true">{{ pad(i + 1) }}</span>
          <span class="panel-frame">
            <app-project-media [project]="project" />
          </span>
          <span class="panel-copy" aria-hidden="true">
            <span class="panel-kinds">
              @for (kind of project.kinds; track kind) {
                <span>{{ kindLabel(kind) }}</span>
              }
              @if (project.status) {
                <span class="is-status">{{ project.status }}</span>
              }
            </span>
            <span class="panel-title">{{ project.name }} <span class="panel-arrow">↗</span></span>
            <span class="panel-tagline">{{ project.tagline }}</span>
          </span>
        </button>
      }
    </div>

    <div class="progress" aria-hidden="true"><span></span></div>
  </div>
</div>
