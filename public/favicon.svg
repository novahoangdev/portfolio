<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-body-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="fav-screen-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="fav-display-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
  </defs>

  <style>
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes ledPulse {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }
    @keyframes bobbing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-1.5px); }
    }
    .laptop-group { animation: bobbing 3.5s ease-in-out infinite; }
    .cursor { animation: cursorBlink 0.9s steps(2, start) infinite; }
    .led { transform-origin: 55px 51px; animation: ledPulse 2s ease-in-out infinite; }
  </style>

  <!-- Transparent rounded badge container -->
  <rect width="64" height="64" rx="14" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <g class="laptop-group">
    <!-- Screen Lid Open -->
    <rect x="10" y="10" width="44" height="34" rx="4.5" fill="url(#fav-screen-border)" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
    
    <!-- Camera -->
    <circle cx="32" cy="12.5" r="0.8" fill="#38bdf8" />

    <!-- Screen Display -->
    <rect x="13" y="15" width="38" height="27" rx="2.5" fill="url(#fav-display-grad)" />

    <!-- Traffic light dots -->
    <circle cx="16.5" cy="18" r="1" fill="#f87171" />
    <circle cx="19.5" cy="18" r="1" fill="#fbbf24" />
    <circle cx="22.5" cy="18" r="1" fill="#34d399" />

    <!-- Code lines -->
    <line x1="16.5" y1="23" x2="28" y2="23" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="31" y1="23" x2="42" y2="23" stroke="#2dd4bf" stroke-width="1.8" stroke-linecap="round" />

    <line x1="19" y1="27" x2="35" y2="27" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" />
    <line x1="38" y1="27" x2="46" y2="27" stroke="#f472b6" stroke-width="1.8" stroke-linecap="round" />

    <line x1="19" y1="31" x2="30" y2="31" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" />
    <line x1="33" y1="31" x2="48" y2="31" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

    <line x1="16.5" y1="35" x2="26" y2="35" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />
    <rect class="cursor" x="28" y="34" width="2" height="3" fill="#2dd4bf" />

    <!-- Base / Chassis Deck -->
    <path d="M 6 48 L 58 48 C 58 52, 54 54, 50 54 L 14 54 C 10 54, 6 52, 6 48 Z" fill="url(#fav-body-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
    
    <!-- Trackpad & Notch -->
    <rect x="26" y="49.5" width="12" height="3" rx="0.8" fill="#1e293b" stroke="rgba(255,255,255,0.12)" stroke-width="0.6" />
    <rect x="29" y="47.8" width="6" height="1" rx="0.5" fill="#0f172a" />

    <!-- LED -->
    <circle class="led" cx="55" cy="51" r="1.1" fill="#2dd4bf" />
  </g>
</svg>
